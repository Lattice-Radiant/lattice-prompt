name: Release bundle

# Builds lattice-prompt-<version>-win64.zip on a Windows runner and
# lattice-prompt-<version>-linux-x86_64.tar.gz on a Linux runner from the
# pinned components and the runtime inputs in lock/third-party.json, runs the
# smoke test inside each bundle, and attaches both archives to a GitHub
# release when the run was dispatched with publish=true. The two components
# are private repositories of the same organisation, so the checkout needs a
# token that can read them (secret COMPONENTS_TOKEN); the default
# GITHUB_TOKEN sees only this repository.

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Bundle version, for example 0.1.0'
      kb_family:
        description: 'Optional: keep only knowledge-base designs, boards and device notes of this family (for example certuspro_nx)'
        default: ''
        required: false
      publish:
        description: 'Create a GitHub release with the archives'
        type: boolean
        default: false

jobs:
  bundle:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: win64
            runner: windows-latest
            archive: zip
          - platform: linux-x86_64
            runner: ubuntu-22.04
            archive: tar.gz
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    steps:
      - name: Checkout with the component pins
        uses: actions/checkout@v4
        with:
          submodules: true
          token: ${{ secrets.COMPONENTS_TOKEN }}

      - name: Set up the build Python (build script only; not the bundled one)
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install GNU make for the Windows bundle
        if: matrix.platform == 'win64'
        shell: pwsh
        run: choco install make --no-progress -y

      - name: Build the bundle (Windows)
        if: matrix.platform == 'win64'
        shell: pwsh
        run: |
          $make = (Get-Command make).Source
          python build/build.py --version "${{ inputs.version }}" --platform win64 --make-exe "$make" $( [ -n "${{ inputs.kb_family }}" ] && echo "--kb-family ${{ inputs.kb_family }}" )

      - name: Build the bundle (Linux)
        if: matrix.platform == 'linux-x86_64'
        shell: bash
        run: python build/build.py --version "${{ inputs.version }}" --platform linux-x86_64 $( [ -n "${{ inputs.kb_family }}" ] && echo "--kb-family ${{ inputs.kb_family }}" )

      - name: Record what was built
        shell: bash
        run: cat "dist/lattice-prompt-${{ inputs.version }}-${{ matrix.platform }}/VERSION.json"

      - name: Upload the bundle as a workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: lattice-prompt-${{ inputs.version }}-${{ matrix.platform }}
          path: |
            dist/lattice-prompt-${{ inputs.version }}-${{ matrix.platform }}.${{ matrix.archive }}
            dist/lattice-prompt-${{ inputs.version }}-${{ matrix.platform }}.${{ matrix.archive }}.sha256
          if-no-files-found: error

  publish:
    if: ${{ inputs.publish }}
    needs: bundle
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout (release notes and the component pins)
        uses: actions/checkout@v4

      - name: Collect both bundles
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Publish a GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls -l dist
          # RELEASE_NOTES.md (install and native-simulation summary) followed
          # by the exact component commits of this release.
          { sed "s/<version>/${{ inputs.version }}/g" RELEASE_NOTES.md
            echo
            echo "## Components"
            echo
            git ls-tree HEAD components/ | awk '{print "- `" $4 "`: " $3}'
          } > notes.md
          gh release create "v${{ inputs.version }}" dist/* \
            --repo "${{ github.repository }}" \
            --title "lattice-prompt ${{ inputs.version }}" \
            --latest \
            --notes-file notes.md

      - name: Mark the previous release as superseded
        # The new release is "Latest"; every older release gets a banner at the
        # top of its notes pointing at the newest one, so a user who lands on
        # an old release page reaches the current bundle in one click.
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          new="v${{ inputs.version }}"
          url="https://github.com/${{ github.repository }}/releases/tag/$new"
          for tag in $(gh release list --repo "${{ github.repository }}" --exclude-drafts --limit 50 --json tagName -q '.[].tagName'); do
            [ "$tag" = "$new" ] && continue
            gh release view "$tag" --repo "${{ github.repository }}" --json body -q .body > old.md
            if grep -q "^> \*\*Superseded" old.md; then
              # refresh an existing banner to point at the newest release
              sed -i "1,2d" old.md
            fi
            { echo "> **Superseded.** This release is old; use the latest release, [$new]($url)."
              echo
              cat old.md
            } > updated.md
            gh release edit "$tag" --repo "${{ github.repository }}" --notes-file updated.md
            echo "marked $tag as superseded by $new"
          done
